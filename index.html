<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Phân Tích Điểm Xét Tuyển Đại Học</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-radius: 12px; }
        .table-container { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .badge { font-size: 0.85rem; padding: 6px 10px; }
    </style>
</head>
<body>
<div class="container my-4">
    <h1 class="text-center mb-1 fw-bold text-primary">📊 HỆ THỐNG TÍNH ĐIỂM XÉT TUYỂN ĐẠI HỌC</h1>
    <p class="text-center text-muted mb-4">Thông tin chỉ mang tính chất tham khảo</p>

    <div class="row g-4">
        <div class="col-lg-4">
            
            <div class="card p-3 mb-3">
                <h5 class="fw-bold text-secondary border-bottom pb-2">1. Chọn Trường & Chứng Chỉ</h5>
                <div class="mb-2">
                    <label class="form-label small fw-semibold">Trường Đại học</label>
                    <select id="school-select" class="form-select border-primary"></select>
                </div>
                <div class="mb-2">
                    <label class="form-label small fw-semibold">Chứng chỉ (Nếu có)</label>
                    <select id="cert-type" class="form-select">
                        <option value="">-- Không có --</option>
                    </select>
                </div>
            </div>

            <div class="card p-3 mb-3">
                <h5 class="fw-bold text-secondary border-bottom pb-2">2. Nhập Điểm Của Bạn</h5>

                <div class="mb-3">
                    <label class="form-label small fw-bold text-danger">Khu vực ưu tiên</label>
                    <select id="bonus-ut" class="form-select form-select-sm border-danger">
                        <option value="0">Khu vực 3 (0 điểm)</option>
                        <option value="0.25">Khu vực 2 (0.25 điểm)</option>
                        <option value="0.5">Khu vực 2-NT (0.5 điểm)</option>
                        <option value="0.75">Khu vực 1 (0.75 điểm)</option>
                    </select>
                </div>

                <label class="form-label small fw-bold text-primary mt-1">Toán - Văn - Ngoại ngữ</label>
                <div class="row g-2 mb-2">
                    <div class="col-4"><input type="number" step="0.01" id="score-m-toan" class="form-control form-control-sm" placeholder="Toán"></div>
                    <div class="col-4"><input type="number" step="0.01" id="score-m-van" class="form-control form-control-sm" placeholder="Văn"></div>
                    <div class="col-4"><input type="number" step="0.01" id="score-m-anh" class="form-control form-control-sm" placeholder="Anh"></div>
                    <div class="col-4"><input type="number" step="0.01" id="score-m-nga" class="form-control form-control-sm" placeholder="Nga"></div>
                    <div class="col-4"><input type="number" step="0.01" id="score-m-phap" class="form-control form-control-sm" placeholder="Pháp"></div>
                    <div class="col-4"><input type="number" step="0.01" id="score-m-trung" class="form-control form-control-sm" placeholder="Trung"></div>
                    <div class="col-4"><input type="number" step="0.01" id="score-m-duc" class="form-control form-control-sm" placeholder="Đức"></div>
                    <div class="col-4"><input type="number" step="0.01" id="score-m-nhat" class="form-control form-control-sm" placeholder="Nhật"></div>
                    <div class="col-4"><input type="number" step="0.01" id="score-m-han" class="form-control form-control-sm" placeholder="Hàn"></div>
                </div>

                <label class="form-label small fw-bold text-primary mt-1">KHTN & KHXH</label>
                <div class="row g-2 mb-2">
                    <div class="col-4"><input type="number" step="0.01" id="score-m-ly" class="form-control form-control-sm" placeholder="Lý"></div>
                    <div class="col-4"><input type="number" step="0.01" id="score-m-hoa" class="form-control form-control-sm" placeholder="Hóa"></div>
                    <div class="col-4"><input type="number" step="0.01" id="score-m-sinh" class="form-control form-control-sm" placeholder="Sinh"></div>
                    <div class="col-4"><input type="number" step="0.01" id="score-m-su" class="form-control form-control-sm" placeholder="Sử"></div>
                    <div class="col-4"><input type="number" step="0.01" id="score-m-dia" class="form-control form-control-sm" placeholder="Địa"></div>
                    <div class="col-4"><input type="number" step="0.01" id="score-m-gdktpl" class="form-control form-control-sm" placeholder="GDKTPL"></div>
                </div>

                <label class="form-label small fw-bold text-primary mt-1">Nhóm Tin & Công Nghệ</label>
                <div class="row g-2 mb-3">
                    <div class="col-4"><input type="number" step="0.01" id="score-m-tin" class="form-control form-control-sm" placeholder="Tin học"></div>
                    <div class="col-4"><input type="number" step="0.01" id="score-m-cncn" class="form-control form-control-sm" placeholder="CN CN"></div>
                    <div class="col-4"><input type="number" step="0.01" id="score-m-cnnn" class="form-control form-control-sm" placeholder="CN NN"></div>
                </div>

                <label class="form-label small fw-bold text-success border-top pt-2">Nhập điểm HSA</label>
                <div class="row g-2 mb-3">
                    <div class="col-12">
                        <input type="number" step="0.5" id="score-hsa" class="form-control form-control-sm" placeholder="Điểm HSA (VD: 95.5)">
                    </div>
                </div>

                <button onclick="runCoreAnalysisEngine()" class="btn btn-primary w-100 fw-bold shadow-sm py-2">🚀 TIẾN HÀNH PHÂN TÍCH</button>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="table-container h-100">
                <h5 class="fw-bold mb-3 text-dark">📋 Bảng Kết Quả Xét Tuyển</h5>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 10%">Mã</th>
                                <th style="width: 30%">Tên Ngành</th>
                                <th style="width: 15%">Khối Tối Ưu</th>
                                <th style="width: 25%">Điểm Bạn / Điểm Chuẩn</th>
                                <th style="width: 20%">Trạng Thái</th>
                            </tr>
                        </thead>
                        <tbody id="results-tbody">
                            <tr>
                                <td colspan="5" class="text-center text-muted py-5">
                                    Vui lòng nhập điểm và ấn "Tiến hành phân tích" để xem kết quả.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
<script src="database.js"></script>
<script src="db/hus.js"></script>
<script src="db/tmu.js"></script>
<script src="db/ueb.js"></script>
<script src="db/ussh.js"></script>
<script>
// ================= HÀM KHỞI TẠO GIAO DIỆN =================
// Hàm này sẽ tự động chạy ngay khi trang web vừa mở lên
window.addEventListener("DOMContentLoaded", () => {
    // 1. Tìm cái ô Chọn Trường trên giao diện
    const schoolSelect = document.getElementById("school-select");
    
    if (schoolSelect) {
        schoolSelect.innerHTML = '<option value="">-- Chọn trường Đại học --</option>';
        
        // 2. Quét toàn bộ kho dữ liệu UNIVERSITY_DATABASE để lấy tên các trường
        for (let schoolKey in UNIVERSITY_DATABASE) {
            let option = document.createElement("option");
            option.value = schoolKey; // VD: "HUS"
            option.textContent = UNIVERSITY_DATABASE[schoolKey].name; // VD: "Đại học Khoa học Tự nhiên"
            schoolSelect.appendChild(option);
        }
        
        // 3. Lắng nghe xem khi nào người dùng bấm chọn đổi trường thì chạy hàm onSchoolChange
        schoolSelect.addEventListener("change", onSchoolChange);
    }
});

// ================= HÀM XỬ LÝ KHI ĐỔI TRƯỜNG =================
function onSchoolChange() {
    const schoolKey = document.getElementById("school-select").value;
    const certSelect = document.getElementById("cert-type");
    
    // Nếu người dùng chọn "-- Chọn trường --" (Tức là chưa chọn gì) thì thoát hàm
    if (!schoolKey) return;

    // Cập nhật danh sách chứng chỉ ngoại ngữ tương ứng với trường đó
    if (certSelect) {
        certSelect.innerHTML = '<option value="">-- Không có / Không dùng --</option>';
        const schoolCerts = UNIVERSITY_CERTIFICATES[schoolKey]; // Tìm chứng chỉ của riêng trường này
        
        if (schoolCerts) {
            for (let certKey in schoolCerts) {
                // Tạo một nhóm chứng chỉ (VD: Nhóm IELTS)
                let optGroup = document.createElement("optgroup");
                optGroup.label = certKey;
                
                // Lấy các mức điểm (5.5, 6.0...) nhét vào nhóm đó
                for (let level in schoolCerts[certKey].levels) {
                    let option = document.createElement("option");
                    option.value = `${certKey}|${level}`; // VD: "IELTS|5.5"
                    option.textContent = schoolCerts[certKey].levels[level].text;
                    optGroup.appendChild(option);
                }
                certSelect.appendChild(optGroup);
            }
        }
    }
}
    // ================= HÀM LẤY ĐIỂM TỪ Ô NHẬP LIỆU =================
// Hàm này giúp lấy điểm an toàn, nếu ô nào để trống thì tự hiểu là 0 điểm
function getVal(id) {
    let element = document.getElementById("score-" + id);
    return element && element.value ? parseFloat(element.value) : 0;
}

// ================= BỘ LÕI XỬ LÝ PHÂN TÍCH (CORE ENGINE) =================
function runCoreAnalysisEngine() {
    const schoolKey = document.getElementById("school-select").value;
    if (!schoolKey) return alert("Vui lòng chọn một trường Đại học trước khi phân tích!");

    const schoolData = UNIVERSITY_DATABASE[schoolKey];
    const industries = schoolData.industries;
    
    // Tìm cái bảng bên phải và xóa sạch nội dung cũ đi
    const resultsTable = document.getElementById("results-tbody");
    resultsTable.innerHTML = ""; 

    // 1. GOM ĐIỂM THI CỦA THÍ SINH
    const userScores = {
        "m-toan": getVal("m-toan"), "m-van": getVal("m-van"), "m-anh": getVal("m-anh"),
        "m-nga": getVal("m-nga"), "m-phap": getVal("m-phap"), "m-trung": getVal("m-trung"),
        "m-duc": getVal("m-duc"), "m-nhat": getVal("m-nhat"),"m-han": getVal("m-han"), "m-ly": getVal("m-ly"),
        "m-hoa": getVal("m-hoa"), "m-sinh": getVal("m-sinh"), "m-su": getVal("m-su"),
        "m-dia": getVal("m-dia"), "m-gdktpl": getVal("m-gdktpl"), "m-tin": getVal("m-tin"),
        "m-cncn": getVal("m-cncn"), "m-cnnn": getVal("m-cnnn")
    };

    // Lấy điểm Ưu Tiên (KV1, KV2...)
    const bonusUt = parseFloat(document.getElementById("bonus-ut").value) || 0; 
    // Lấy điểm HSA
    const rawHsa = getVal("hsa");
    
    // 2. XỬ LÝ CHỨNG CHỈ NGOẠI NGỮ
    let selectedCert = document.getElementById("cert-type").value;
    let certBonusThpt = 0;
    
    if (selectedCert) {
        const [certName, certLevel] = selectedCert.split("|"); // Cắt chuỗi "IELTS|5.5" ra
        const schoolCertConfig = UNIVERSITY_CERTIFICATES[schoolKey]?.[certName]?.levels?.[certLevel];
        const certLangSubject = UNIVERSITY_CERTIFICATES[schoolKey]?.[certName]?.lang;

        if (schoolCertConfig && certLangSubject) {
            // Nếu điểm quy đổi cao hơn điểm thi thật thì ghi đè điểm ngoại ngữ
            if (schoolCertConfig.score > userScores[certLangSubject]) {
                userScores[certLangSubject] = schoolCertConfig.score;
            }
            // Lấy điểm cộng thêm (bonus) nếu có
            certBonusThpt = schoolCertConfig.bonus || 0;
        }
    }

    // 3. QUÉT QUA TỪNG NGÀNH CỦA TRƯỜNG ĐỂ TÍNH ĐIỂM
    for (let code in industries) {
        let ind = industries[code];
        let bestThptScore = -1; 
        let bestComb = "---";
        let isPassCondition = true;
        if (ind.condition) { 
            if (userScores[ind.condition.subject] < ind.condition.min) {
                isPassCondition = false; 
            }
        }
        if ( isPassCondition ) {

        // Quét từng tổ hợp khối của ngành đó
        ind.combs.forEach(combCode => {
            const subjects = COMBINATIONS_DB[combCode]; // Tìm xem A00 gồm môn gì
            if (!subjects) return; // Nếu khối lạ không có trong database thì bỏ qua

            // Nếu bị điểm liệt (hoặc không nhập điểm) 1 trong 3 môn của khối -> Loại
            if (userScores[subjects[0]] === 0 || userScores[subjects[1]] === 0 || userScores[subjects[2]] === 0) return;

            let totalThreeSubjects = userScores[subjects[0]] + userScores[subjects[1]] + userScores[subjects[2]];
            
            // Xử lý ngành có môn chính nhân hệ số 2
            if (ind.mainSubject && ind.weight === 2 && subjects.includes(ind.mainSubject)) {
                let mainScore = userScores[ind.mainSubject];
                let otherSubjects = subjects.filter(s => s !== ind.mainSubject);
                let totalOthers = userScores[otherSubjects[0]] + userScores[otherSubjects[1]];
                totalThreeSubjects = (mainScore * 2 + totalOthers) * 3 / 4; 
            }

            // Luật Ưu tiên giảm dần theo quy chế mới của Bộ GD&ĐT (>= 22.5)
            let actualBonusUt = bonusUt;
            if (totalThreeSubjects >= 22.5) {
                actualBonusUt = ((30 - totalThreeSubjects) / 7.5) * bonusUt;
            }

            // Tính tổng điểm cuối cùng. (Ưu tiên dùng thptConfig của trường nếu có)
            let finalThpt;
            if (schoolData.thptConfig) {
                finalThpt = schoolData.thptConfig.calculate(totalThreeSubjects, actualBonusUt, certBonusThpt);
            } else {
                finalThpt = totalThreeSubjects + actualBonusUt + certBonusThpt;
            }
            
            // So sánh xem khối này có điểm cao hơn khối trước đó không
            if (finalThpt > bestThptScore) {
                bestThptScore = finalThpt;
                bestComb = combCode;
            }
        });
        }
       // 4. HIỂN THỊ KẾT QUẢ RA BẢNG GIAO DIỆN
        let thptStatusHtml = `<span class="badge bg-danger">Trượt</span>`;
        let displayThptScore = "0.00";

        // --- XỬ LÝ TRẠNG THÁI THPT ---
        if (!isPassCondition) {
            bestComb = "---";
            displayThptScore = "---";
            thptStatusHtml = `<span class="badge bg-dark" title="Điểm thành phần không đạt">Tạch điều kiện ( < ${ind.condition.min}đ )</span>`;
        } 
        else if (bestComb === "---" || bestThptScore === -1) {
            bestComb = "Thiếu điểm";
            displayThptScore = "---";
            thptStatusHtml = `<span class="badge bg-secondary">Không đủ môn</span>`;
        } 
        else {
            displayThptScore = bestThptScore.toFixed(2);
            let combinedTarget = ind.scores.combined || "---"; // Chống lỗi nếu trường ko có điểm chuẩn THPT
            
            if (ind.scores.combined && bestThptScore >= ind.scores.combined) {
                thptStatusHtml = `<span class="badge bg-success">Khả năng Đỗ THPT</span>`;
            } else if (ind.scores.combined) {
                thptStatusHtml = `<span class="badge bg-danger">THPT Thiếu ${(ind.scores.combined - bestThptScore).toFixed(2)} đ</span>`;
            } else {
                thptStatusHtml = `<span class="badge bg-secondary">Không xét THPT</span>`;
            }
        }

        // --- BỔ SUNG: XỬ LÝ VÀ TÍNH ĐIỂM HSA ---
        let displayHsaScore = "";
        let hsaStatusHtml = "";

        // Chỉ tính khi: Trường có bật chức năng HSA + Ngành đó có điểm chuẩn HSA + Người dùng có nhập điểm HSA
        if (schoolData.hsaConfig && schoolData.hsaConfig.status === "active" && ind.scores.hsa && rawHsa > 0) {
            let finalHsa = schoolData.hsaConfig.calculate(rawHsa, bonusUt, certBonusThpt);
            
            // Tạo chuỗi hiển thị điểm HSA ở dòng dưới
            displayHsaScore = `<br><span class="text-primary small">HSA: <span class="fw-bold">${finalHsa.toFixed(2)}</span> / ${ind.scores.hsa}</span>`;
            
            // Đánh giá Đỗ/Trượt HSA
            if (finalHsa >= ind.scores.hsa) {
                hsaStatusHtml = `<br><span class="badge bg-success mt-1">Khả năng Đỗ HSA</span>`;
            } else {
                hsaStatusHtml = `<br><span class="badge bg-warning text-dark mt-1">HSA Thiếu ${(ind.scores.hsa - finalHsa).toFixed(2)} đ</span>`;
            }
        }

        // Tạo 1 dòng mới trong bảng và nhét cả 2 loại điểm vào
        let row = document.createElement("tr");
        row.innerHTML = `
            <td><strong>${code}</strong></td>
            <td class="text-primary fw-semibold">${ind.name}</td>
            <td><span class="badge bg-light text-dark border border-secondary">${bestComb}</span></td>
            <td>
                THPT: <span class="fw-bold">${displayThptScore}</span> / <span class="text-muted small">${ind.scores.combined || "---"}</span>
                ${displayHsaScore}
            </td>
            <td>
                ${thptStatusHtml}
                ${hsaStatusHtml}
            </td>
        `;
        resultsTable.appendChild(row);
    }
}
</script>
</html>
